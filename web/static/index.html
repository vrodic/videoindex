<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videoindex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230a84ff%22/%3E%3Cpath d=%22M6 4.5v7l5.5-3.5z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <input id="search" type="search" placeholder="Search filename…  ( / )" autocomplete="off" spellcheck="false">
    <button id="btn-reset-sort" title="Clear column sort and reload (R)">Reset Sort</button>
    <button id="btn-words" title="Word cloud (W)">Word Cloud</button>
    <button id="btn-dashboard" title="Dashboard (D)">Dashboard</button>
    <button id="btn-scan" title="Scan the media root for new files">Scan</button>
    <button id="btn-options" title="Player options">Player ⚙</button>
    <button id="btn-help" title="Keyboard shortcuts (?)">?</button>
  </header>

  <main class="split" id="split">
    <section class="left">
      <div class="table" id="table" tabindex="0" aria-label="Media list">
        <div class="thead" id="thead"></div>
        <div class="tbody" id="tbody"><div class="tspacer" id="tspacer"></div></div>
      </div>

      <div class="cond-row">
        <div class="combo" id="cond-combo">
          <input id="cond" type="text" placeholder="SQL condition / ORDER BY…" autocomplete="off" spellcheck="false">
          <button id="cond-toggle" class="combo-btn" tabindex="-1" aria-label="Saved conditions">▾</button>
          <ul class="combo-list" id="cond-list" hidden></ul>
        </div>
      </div>
      <div class="status" id="status"></div>

      <details class="actors" id="actors" open>
        <summary>Actors</summary>
        <div class="actors-body">
          <div class="row">
            <input id="actor-filter" list="actor-names" placeholder="Search media by actor(s), comma separated… (Enter)" autocomplete="off">
            <button id="actor-filter-btn">Filter Media</button>
            <div class="popover-anchor">
              <button id="actor-select-btn">Select Actors…</button>
              <div class="popover" id="actor-popover" hidden>
                <input id="actor-popover-search" type="search" placeholder="Filter actors…" autocomplete="off">
                <ul id="actor-popover-list"></ul>
              </div>
            </div>
          </div>
          <div class="pills" id="actor-pills"></div>
          <div class="subhead">Actors for selected media</div>
          <div class="actor-table-wrap">
            <table class="actor-table">
              <thead><tr>
                <th>Name</th><th>Alternate names</th><th class="num">Media</th>
                <th title="Assign to checked media">Assign</th><th title="Filter media by this actor">Filter</th><th title="Search filenames for this actor's names">Search</th>
              </tr></thead>
              <tbody id="actor-rows"></tbody>
            </table>
          </div>
          <div class="row">
            <input id="actor-add" list="actor-names" placeholder="Add actor to selected media… (Enter)" autocomplete="off">
            <button id="actor-add-btn">Add Actor</button>
            <button id="actor-remove-btn">Remove Actor</button>
          </div>
          <datalist id="actor-names"></datalist>
        </div>
      </details>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>

    <section class="right">
      <div class="col">
        <div class="col-head" id="preview-label" title=""></div>
        <div class="col-scroll" id="filmstrip"></div>
      </div>
      <div class="col">
        <div class="col-head">Up Next</div>
        <div class="col-scroll" id="upnext"></div>
      </div>
    </section>
  </main>
</div>

<!-- Generic modal shell; contents are filled per dialog -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
</body>
</html>
